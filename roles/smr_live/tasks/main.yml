---
- name: Checkout git repository 'smrealms/smr'
  ansible.builtin.git:
    repo: https://github.com/smrealms/smr.git
    dest: "{{ smr_home_dir }}"
    version: live

# This is needed so that we don't need verbose -f arguments to docker-compose
- name: Set up the docker-compose live overrides
  ansible.builtin.file:
    src: "{{ smr_home_dir }}/live/docker-compose.override.yml"
    dest: "{{ smr_home_dir }}/docker-compose.override.yml"
    state: link

- name: Create acme.json for traefik
  ansible.builtin.file:
    path: "{{ smr_home_dir }}/traefik/acme.json"
    state: touch
    mode: "0600"

- name: Generate MySql password
  ansible.builtin.set_fact:
    smr_mysql_password: "{{ lookup('password', '/dev/null chars=ascii_letters,digits length=32') }}"

- name: Create configuration directories
  ansible.builtin.file:
    path: "{{ smr_home_dir }}/{{ item.path }}"
    state: directory
    mode: u=rwx,g=rx,o=rx
  with_community.general.filetree: "{{ 'files/' }}"
  when: item.state == 'directory'

- name: Expand and copy configuration files
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ smr_home_dir }}/{{ item.path }}"
    mode: >-
      {{ 'u=rw,g=r,o=r'
         if item.path == 'config/config.specific.php'
         else 'u=rw,g=,o=' }}
  with_community.general.filetree: "{{ 'files/' }}"
  when: item.state == 'file'

- name: Decrypt and copy opendkim files
  ansible.builtin.copy:
    src: files/opendkim
    dest: "{{ smr_home_dir }}"
    mode: u=rw,g=,o=

- name: Restore backups from s3
  ansible.builtin.command: docker compose run --rm backup-s3 s3 sync s3://smrealms-backup /aws --ignore-glacier-warnings --no-progress
  args:
    chdir: "{{ smr_home_dir }}"
    creates: "{{ smr_home_dir }}/backup/archive/smr_12_history.sql.bz2"

- name: Fix file permissions for player images
  ansible.builtin.file:
    path: "{{ smr_home_dir }}/vol_upload"
    recurse: true
    owner: www-data
    group: www-data

- name: Start mysql server to restore database # noqa: no-changed-when
  ansible.builtin.command: docker compose up --detach mysql
  args:
    chdir: "{{ smr_home_dir }}"

- name: Wait for mysql to start
  ansible.builtin.pause:
    seconds: 10

- name: Restore database 'smr_live'
  ansible.builtin.command: ./restore_smr_live.sh
  args:
    chdir: "{{ smr_home_dir }}/backup"
    creates: "{{ smr_home_dir }}/vol_db/smr_live/game.MYD"

- name: Restore database 'smr_12_history'
  ansible.builtin.command: ./restore_smr_archive.sh smr_12_history.sql.bz2
  args:
    chdir: "{{ smr_home_dir }}/backup"
    creates: "{{ smr_home_dir }}/vol_db/smr_12_history/game.MYD"

- name: Restore database 'smr_classic_history'
  ansible.builtin.command: ./restore_smr_archive.sh smr_classic_history.sql.bz2
  args:
    chdir: "{{ smr_home_dir }}/backup"
    creates: "{{ smr_home_dir }}/vol_db/smr_classic_history/game.MYD"

- name: Update password to MySql user 'smr' for when changed on redeploy # noqa: no-changed-when
  ansible.builtin.command: docker compose exec -T mysql mysql -e "ALTER USER {{ smr_mysql_user }} IDENTIFIED BY '{{ smr_mysql_password }}';"
  args:
    chdir: "{{ smr_home_dir }}"

- name: Grant permissions to smr_12_history # noqa: no-changed-when
  ansible.builtin.command: docker compose exec mysql mysql -e "GRANT SELECT ON smr_12_history.* TO {{ smr_mysql_user }};"
  args:
    chdir: "{{ smr_home_dir }}"

- name: Grant permissions to smr_classic_history # noqa: no-changed-when
  ansible.builtin.command: docker compose exec -T mysql mysql -e "GRANT SELECT ON smr_classic_history.* TO {{ smr_mysql_user }};"
  args:
    chdir: "{{ smr_home_dir }}"

- name: Start SMR and related services # noqa: no-changed-when
  ansible.builtin.command: docker compose up --detach smr discord irc traefik
  args:
    chdir: "{{ smr_home_dir }}"

- name: Create cron entry for database backup
  ansible.builtin.cron:
    name: Database backups
    hour: "9"
    minute: "0"
    job: (cd {{ smr_home_dir }} && nice -n 19 ./backup/backup_cron.sh && docker compose run --rm backup-s3 s3 sync /aws s3://smrealms-backup
      --ignore-glacier-warnings --no-progress) 2>&1 | logger -t backup

- name: Install a cron job to run the npc script
  ansible.builtin.cron:
    name: Run the live NPC script
    special_time: hourly
    job: >
      cd {{ smr_home_dir }} &&
      LOGFILE=$(date "+/root/logs/live_npc/\%Y-\%m-\%d/\%H-\%M-\%S.log") &&
      mkdir -p $(dirname $LOGFILE) &&
      docker compose run --rm npc > $LOGFILE 2>&1
