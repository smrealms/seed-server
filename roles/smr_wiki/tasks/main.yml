---
- name: Checkout git repository 'smrealms/wiki-server'
  ansible.builtin.git:
    repo: https://github.com/smrealms/wiki-server.git
    dest: "{{ wiki_home_dir }}"
    version: main

- name: Copy and decrypt configuration files
  ansible.builtin.copy:
    src: files/
    dest: "{{ wiki_home_dir }}"
    mode: "0600"

- name: Start wiki service and dependencies # noqa: no-changed-when
  ansible.builtin.command: docker compose up --detach wiki
  args:
    chdir: "{{ wiki_home_dir }}"
